services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-7080}:7080"
  dns-control:
    ports:
      - "${DNS_PORT:-53}:53/udp"
      - "${DNS_PORT:-53}:53/tcp"
      - "127.0.0.1:${DNS_API_PORT:-8080}:8080"
  web:
    ports:
      - "${WEB_PORT:-3000}:3000"
