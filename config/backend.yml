app:
  name: wraplink-api
  environment: ${APP_ENV}
  frontend-url: ${FRONTEND_URL}
http:
  host: 0.0.0.0
  port: "7080"
  read-timeout: 15s
  write-timeout: 15s
  idle-timeout: 60s
  shutdown-timeout: 10s
database:
  url: ${DATABASE_URL}
  max-conns: 20
  min-conns: 2
  max-conn-lifetime: 1h
  max-conn-idle-time: 30m
security:
  jwt-secret: ${JWT_SECRET}
  access-token-ttl: 15m
  refresh-token-ttl: 720h
  secure-cookies: ${SECURE_COOKIES}
  refresh-cookie-domain: "${COOKIE_DOMAIN}"
payments:
  dev-settlement-key: ${PAYMENTS_DEV_SETTLEMENT_KEY}
network:
  usage-ingest-key: ${NETWORK_USAGE_INGEST_KEY}
  control-sync-key: ${NETWORK_CONTROL_SYNC_KEY}
  dns-control-url: ${DNS_CONTROL_API_URL}
  dns-control-token: ${DNS_CONTROL_API_TOKEN}
  control-node-offline-after: 45s
  dns-servers: []
  proxy:
    host: ""
    port: 0
    protocol: ""
cors:
  allowed-origins:
    - ${FRONTEND_URL}
server:
  trusted-proxies: []
